<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="행성의 궤도와 자전축을 조정하고, 1년 동안 태양이 그리는 아날렘마를 관측하는 시뮬레이터.">
  <title>아날렘마 시뮬레이션</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="fonts/pretendard/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="src/simulator/app.css">
  <script src="src/simulator/physics.js" defer></script>
  <script src="src/simulator/environment.js" defer></script>
  <script src="src/simulator/renderer.js" defer></script>
  <script src="src/simulator/app.js" defer></script>
</head>
<body>
  <svg class="icon-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-orbit" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="5" transform="rotate(-35 12 12)"/><circle cx="12" cy="12" r="2"/><circle cx="20" cy="7" r="1.5" fill="currentColor"/></symbol>
    <symbol id="i-sky" viewBox="0 0 24 24"><path d="M3 17a9 9 0 0 1 18 0M2 20h20M12 3v2M4 7l2 2m12 0 2-2"/><circle cx="12" cy="13" r="2"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 3v17h17M8 15l4-7 4 5 5-7"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1 7M3 4v6h6"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5M9 12h6m-3-3v6"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M3 9V3h6m6 0h6v6m0 6v6h-6m-6 0H3v-6"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M15 4v16"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14" stroke-width="4"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M6 5v14m12-14L8 12l10 7Z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M18 5v14M6 5l10 7-10 7Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h16v16H4ZM4 9h16M4 15h16M9 4v16m6-16v16"/></symbol>
    <symbol id="i-trail" viewBox="0 0 24 24"><path d="M12 12C5 6 7 3 12 3s7 3 0 9-10 9 0 9 7-3 0-9Z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--panel)"/><circle cx="15" cy="17" r="3" fill="var(--panel)"/></symbol>
    <symbol id="i-compare" viewBox="0 0 24 24"><path d="M4 4v16M20 4v16M8 8h8m-3-3 3 3-3 3M16 16H8m3-3-3 3 3 3"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 5 2c-1 1-2 1-2 3m0 3h.01"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h15l-4-4M20 16H5l4 4"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></symbol>
    <symbol id="i-tilt" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="m8 2 8 20M5 15l14-6"/></symbol>
    <symbol id="i-eccentric" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="6" transform="rotate(-25 12 12)"/><circle cx="7" cy="14" r="1.5" fill="currentColor"/></symbol>
    <symbol id="i-perihelion" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="7"/><circle cx="7" cy="12" r="1.5" fill="currentColor"/><path d="M9 12h9m-3-3 3 3-3 3"/></symbol>
    <symbol id="i-latitude" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 7h14M5 17h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14m-7-7v14"/></symbol>
  </defs></svg>
  <div class="app-shell" id="app">
    <main class="workspace">
      <section class="viewport" id="viewport" aria-label="시뮬레이션">
        <canvas id="scene" tabindex="0" aria-label="태양 관측. 드래그와 화살표로 이동, 휠·핀치·더하기·빼기로 확대 및 축소."></canvas>
        <nav class="planet-picker" id="presets" aria-label="행성 선택"></nav>
        <button class="context-view" id="contextSwap" aria-label="궤도 크게 보기" title="궤도 크게 보기">
          <canvas id="contextScene" aria-hidden="true"></canvas><span class="context-label" id="contextLabel">공전 궤도</span><span class="swap-mark"><svg class="icon" aria-hidden="true"><use href="#i-swap"/></svg></span>
        </button>
<div class="scene-legend" id="legend" aria-label="위도 범례" hidden></div>
        <button id="findSun" class="find-sun" hidden><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg><span>태양 찾기</span></button>
      </section>
      <button id="panelEdge" class="panel-edge" aria-label="속성 패널 숨기기" aria-expanded="true" aria-controls="inspector"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><aside class="inspector" id="inspector" aria-label="행성 속성">
        <header class="selected-object"><span id="selectedPlanet" class="planet earth" aria-hidden="true"></span><h1 id="planetName">지구</h1><span id="modified" class="modified" title="기본값에서 수정됨" aria-label="기본값에서 수정됨" hidden></span><button id="restorePreset" class="icon-button" aria-label="행성 기본값 복원" title="행성 기본값 복원" ><svg class="icon" aria-hidden="true"><use href="#i-reset"/></svg></button><button id="closePanel" class="icon-button" aria-label="속성 패널 닫기" title="속성 패널 닫기" ><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></header>
        <div class="inspector-scroll">
          <div id="properties" class="properties"></div>
          <dl class="live-readings" aria-label="현재 관측값"><div><dt>고도</dt><dd id="currentAlt">—</dd></div><div><dt>방위각</dt><dd id="currentAz">—</dd></div><div><dt>균시차</dt><dd id="currentEot">—</dd></div></dl>
          <span id="visibilityState" class="below-horizon" hidden>지평선 아래</span>
          <details id="annualStats" class="annual-stats"><summary>변화 범위 <svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></summary><dl><div><dt>고도</dt><dd id="statAlt">—</dd></div><div><dt>방위각</dt><dd id="statAz">—</dd></div><div><dt>균시차</dt><dd id="statEot">—</dd></div></dl></details>
        </div>
      </aside>
    </main>
    <footer class="transport" aria-label="시뮬레이션 도구">
      <div class="time-controls" role="group" aria-label="시간 제어">
        <div class="playback"><button id="stepBack" class="icon-button" aria-label="공전 1% 이전" title="공전 1% 이전" ><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button><button id="play" class="play-button" aria-label="재생" title="재생 / 정지 (Space)"><svg class="icon" aria-hidden="true"><use id="playIcon" href="#i-play"/></svg></button><button id="stepForward" class="icon-button" aria-label="공전 1% 다음" title="공전 1% 다음" ><svg class="icon" aria-hidden="true"><use href="#i-next"/></svg></button></div>
        <button class="phase-toggle" id="phaseToggle" aria-label="공전 위치 이동" aria-expanded="false" aria-controls="phasePopover" title="공전 위치 이동"><span class="phase-label">공전</span><output class="phase-readout"><span id="phaseValue">0.0</span><span>%</span></output><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></button>
        <select id="speed" aria-label="재생 속도, 1배는 1공전당 20초" title="재생 속도 · 1× = 1공전 / 20초"><option value="0.02">0.4×</option><option value="0.05" selected>1×</option><option value="0.1">2×</option><option value="0.2">4×</option></select>
      </div>
<section class="phase-popover" id="phasePopover" aria-label="공전 위치 이동" hidden><div class="phase-entry"><label for="phaseNumber">공전 위치</label><div class="number-field"><input type="number" id="phaseNumber" min="0" max="100" step="0.1" value="0" aria-label="공전 위치 퍼센트"><span>%</span></div></div><div class="timeline"><label class="sr-only" for="phase">공전 진행률</label><input id="phase" type="range" min="0" max="100" step="0.01" value="0"></div><div class="phase-stops" aria-label="공전 위치 바로 이동"><button data-phase="0">0%</button><button data-phase="25">25%</button><button data-phase="50">50%</button><button data-phase="75">75%</button><button data-phase="100">100%</button></div></section>
      <nav class="tool-dock" aria-label="화면 도구">
        <div class="tool-group">
          <button id="cameraToggle" class="icon-button" aria-label="궤도 크게 보기" title="궤도 크게 보기" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-orbit"/></svg><span class="tool-label">궤도</span></button>
          <button id="graphToggle" class="icon-button" aria-label="그래프 열기 (3)" title="그래프 열기 (3)" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg><span class="tool-label">그래프</span></button>
          <button id="compareToggle" class="icon-button" aria-label="위도 비교: 0°, 30°N, 60°N, 89°N" title="위도 비교: 0°, 30°N, 60°N, 89°N" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-compare"/></svg><span class="tool-label">위도 비교</span></button>
        </div>
        <div class="tool-group">
          <button id="gridToggle" class="icon-button" aria-label="격자 (G)" title="격자 (G)" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg><span class="tool-label">격자</span></button>
          <button id="trailToggle" class="icon-button" aria-label="궤적 (T)" title="궤적 (T)" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#i-trail"/></svg><span class="tool-label">궤적</span></button>
        </div>
        
        <div class="tool-group">
          <button id="reset" class="icon-button" aria-label="시뮬레이션 초기화" title="시뮬레이션 초기화" ><svg class="icon" aria-hidden="true"><use href="#i-reset"/></svg><span class="tool-label">초기화</span></button>
          <button id="fullscreen" class="icon-button" aria-label="전체 화면 (F)" title="전체 화면 (F)" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-expand"/></svg><span class="tool-label">전체 화면</span></button>
<button id="environmentToggle" class="icon-button" aria-label="배경 설정" title="배경 설정" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#i-sky"/></svg><span class="tool-label">배경</span></button>
          <button id="panelToggle" class="icon-button" aria-label="속성 패널 숨기기" title="속성 패널 숨기기" aria-expanded="true" aria-controls="inspector"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg><span class="tool-label">속성</span></button>
        </div>
      </nav>
<nav class="camera-tools" aria-label="카메라 조작">
          <button id="zoomOut" class="icon-button" aria-label="축소 (−)" title="축소 (−)" ><svg class="icon" aria-hidden="true"><use href="#i-minus"/></svg></button>
          <button id="zoomIn" class="icon-button" aria-label="확대 (+)" title="확대 (+)" ><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
          <button id="fit" class="icon-button" aria-label="시점 맞춤 (R)" title="시점 맞춤 (R)" ><svg class="icon" aria-hidden="true"><use href="#i-fit"/></svg></button>
        </nav>
    </footer>
  </div>
  <dialog id="environmentDialog" aria-labelledby="environmentTitle">
    <header class="dialog-heading"><h2 id="environmentTitle">배경</h2><button id="closeEnvironment" class="icon-button" aria-label="배경 설정 닫기"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></header>
    <div class="environment-body"><div class="background-choices" role="group" aria-label="관측 배경">
      <button data-background="atacama" aria-pressed="true"><span class="background-preview desert"></span><span>아타카마</span></button>
<button data-background="hilly_terrain_01" aria-pressed="false"><span class="background-preview" style="background-image:url('assets/hilly_terrain_01.jpg')"></span><span>언덕</span></button>
<button data-background="kloppenheim_03" aria-pressed="false"><span class="background-preview" style="background-image:url('assets/kloppenheim_03.jpg')"></span><span>초원</span></button>
<button data-background="spruit_sunrise" aria-pressed="false"><span class="background-preview" style="background-image:url('assets/spruit_sunrise.jpg')"></span><span>일출</span></button>
<button data-background="forest_slope" aria-pressed="false"><span class="background-preview" style="background-image:url('assets/forest_slope.jpg')"></span><span>숲</span></button>
<button data-background="snowy_park_01" aria-pressed="false"><span class="background-preview" style="background-image:url('assets/snowy_park_01.jpg')"></span><span>설원</span></button>
    </div><div class="environment-setting"><label for="backgroundBrightness">밝기</label><output id="brightnessValue">100%</output><input id="backgroundBrightness" type="range" min="30" max="140" step="1" value="100"></div>
    <div class="environment-setting"><label for="backgroundRotation">방향</label><output id="rotationValue">0°</output><input id="backgroundRotation" type="range" min="0" max="360" step="1" value="0"></div>
    <button id="resetEnvironment" class="environment-reset">배경 기본값</button><details class="background-credit"><summary>사진 출처</summary><a class="photo-source" id="photoCredit" href="https://www.eso.org/public/images/uhd_img2563pv2_cc_eq/" target="_blank" rel="noopener">ESO/B. Tafreshi · CC BY 4.0</a><p id="photoDetails"></p><p>지구 표면: Solar System Scope · CC BY 4.0</p><p>사진은 관측 배경이며 현재 위도·시간의 실제 하늘을 계산한 것은 아닙니다.</p></details></div>
  </dialog>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
